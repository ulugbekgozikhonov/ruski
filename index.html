<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2456d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruscha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rus tili — so'zlar</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#2456d6;--bd:#e3e1da}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1e;--tx:#f0efea;--mut:#9b9a94;--ac:#6d93ff;--bd:#333}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;color:var(--tx)}
.wrap{max-width:520px;margin:0 auto;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* --- Bosh sahifa --- */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);margin:-12px -12px 12px;padding:12px;border-bottom:1px solid var(--bd);font-size:17px;font-weight:700}
.cont{width:100%;display:flex;align-items:center;gap:12px;background:var(--ac);color:#fff;border:none;border-radius:14px;padding:14px 16px;margin-bottom:12px;text-align:left}
.cont span{flex:1}
.cont small{display:block;opacity:.8;font-size:12px;margin-bottom:2px}
.cont b{font-size:16px}
#cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start}
.cat{display:block;width:100%;margin:0;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;text-align:left}
.cat .ic{width:38px;height:38px;margin-bottom:8px;border-radius:12px;background:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center}
.cat .nm{font-weight:600;font-size:15px}
.cat .nm i{display:block;margin-top:2px;font-style:normal;font-weight:400;font-size:13px;color:var(--mut)}
.bar{height:4px;margin-top:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar div{height:100%;background:var(--ac);border-radius:9px}
.msg{grid-column:1/-1;color:var(--mut);text-align:center;padding:24px 0}

/* --- O'rganish sahifasi --- */
#study{display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ghost{background:none;border:none;color:var(--ac);font-size:14px;padding:6px 0}
.count{color:var(--mut);font-size:13px}
.speed{background:none;border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:13px}
.card{height:clamp(220px,36dvh,280px);overflow-y:auto;display:flex;flex-direction:column;justify-content:safe center;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 14px;text-align:center}
.ru{font-size:26px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.uz{font-size:17px;color:var(--ac);margin-top:6px;min-height:22px}
hr{width:100%;margin:14px 0;border:none;border-top:1px solid var(--bd)}
.sr{font-size:17px;line-height:1.35}
.su{font-size:14px;color:var(--mut);margin-top:6px}
.hide .uz,.hide .su{visibility:hidden}
.hide .card{cursor:pointer}
.listen{width:100%;height:64px;margin-top:12px;font-size:19px;font-weight:600;border-radius:16px;border:1px solid var(--bd);background:var(--card)}
.listen.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1;height:58px;font-size:17px;font-weight:600;border-radius:16px;border:1px solid var(--bd);background:var(--card)}
.row .pw{flex:none;width:58px;font-size:22px}
.row .main{background:var(--ac);color:#fff;border-color:var(--ac)}
.hb{width:100%;margin-top:10px;padding:11px;font-size:14px;border-radius:12px;border:1px solid var(--bd);background:none}
.hb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{color:var(--mut);font-size:11px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <header class="hdr">Mavzular</header>
  <button class="cont hidden" id="cont"><span><small>Davom etish</small><b id="contT"></b></span>→</button>
  <div id="cats"><div class="msg">Yuklanmoqda…</div></div>
</div>

<div id="study" class="hidden">
  <div class="top">
    <button class="ghost" id="back">← Mavzular</button>
    <span class="count" id="count"></span>
    <button class="speed" id="speed"></button>
  </div>
  <div class="card" id="card">
    <div class="ru" id="ru"></div>
    <div class="uz" id="uz"></div>
    <hr>
    <div class="sr" id="sr"></div>
    <div class="su" id="su"></div>
  </div>
  <button id="auto" class="listen">🎧 Tinglash</button>
  <div class="row">
    <button id="pw" class="pw" aria-label="So'zni eshitish">🔊</button>
    <button id="prev">← Oldingi</button>
    <button id="next" class="main">Keyingi →</button>
  </div>
  <button id="hideBtn" class="hb">👁 Tarjimani yashirish</button>
  <div class="note" id="note"></div>
</div>

</div>

<script>
/* So'zlar words.json da. Audio: tools/make_audio.py (GitHub Actions o'zi ishga tushiradi). */
const $ = id => document.getElementById(id);
const plain = s => s.replace(/'/g, '');                                       // urg'u belgisisiz
const stress = s => plain(s.replace(/([аеиоуыэюяАЕИОУЫЭЮЯ])'/g, '$1́')); // ба'бушка -> ба́бушка
const RATES = [0.8, 1, 1.25];

let CATS = [], AUD = {}, cat = null, catN = 0, i = 0, hidden = false;
let playing = false, stopAt = null, token = 0, loaded = null, ruVoice = null;
const audio = new Audio();
audio.loop = true;

/* --- Progress (telefonda saqlanadi) --- */
let P = {last: null, seen: {}, rate: 1};
try { P = Object.assign(P, JSON.parse(localStorage.getItem('rusP') || '{}')); } catch (e) {}
function saveP(){ try { localStorage.setItem('rusP', JSON.stringify(P)); } catch (e) {} }

/* --- Ma'lumot --- */
Promise.all([
  fetch('words.json').then(r => r.json()),
  fetch('audio/index.json').then(r => r.json()).catch(() => ({}))
]).then(([c, a]) => {
  CATS = c; AUD = a;
  // eski versiyada progress mavzu raqami bilan saqlangan edi
  CATS.forEach((x, n) => { if (P.seen[n] && !P.seen[x.id]) { P.seen[x.id] = P.seen[n]; delete P.seen[n]; } });
  renderHome();
}).catch(() => { $('cats').innerHTML = '<div class="msg">So\'zlarni yuklab bo\'lmadi. Internetni tekshiring.</div>'; });

/* Mavzu uchun tayyor audio (words.json o'zgarib, audio hali yangilanmagan bo'lsa — null) */
function track(){
  const a = cat && AUD[cat.id];
  return a && a.items.length === cat.items.length && a.items.every((x, k) => x.ru === cat.items[k][0]) ? a : null;
}
let loading = null; // {file, promise} — hozir yuklanayotgan audio
function loadAudio(){
  const a = track();
  if (!a || loaded === a.file) return Promise.resolve(!!a);
  if (loading && loading.file === a.file) return loading.promise;
  note('Audio yuklanmoqda…');
  const promise = (async () => {
    try {
      const r = await fetch(a.file);
      if (!r.ok) throw 0;
      const blob = await r.blob();
      const now = track();
      if (!now || now.file !== a.file) return false; // bu orada boshqa mavzu ochildi
      if (audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(blob); loaded = a.file; note('');
      return true;
    } catch (e) {
      if (track() === a) note("Audio yuklanmadi — telefon ovozidan foydalaniladi.");
      return false;
    } finally { if (loading && loading.file === a.file) loading = null; }
  })();
  loading = {file: a.file, promise};
  return promise;
}
const ready = () => { const a = track(); return a && loaded === a.file ? a : null; };

/* --- Telefon ovozi (audio yo'q bo'lsa zaxira) --- */
function pickVoice(){
  ruVoice = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith('ru')) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(plain(text).replace(/\//g, ','));
    u.lang = 'ru-RU'; u.rate = 0.85 * P.rate;
    if (ruVoice) u.voice = ruVoice;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms / P.rate));

/* --- Ijro --- */
function stopAll(){
  playing = false; stopAt = null; token++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  audio.pause();
  updAuto();
}
async function startAuto(){
  stopAt = null; token++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  playing = true; updAuto();
  if (!ready() && !(await loadAudio())) return ttsLoop(token);
  if (!playing) return;
  audio.currentTime = ready().items[i].t;
  audio.playbackRate = P.rate;
  audio.play().catch(() => { playing = false; updAuto(); note('Yana bir marta bosing.'); });
}
async function ttsLoop(my){
  while (playing && my === token){
    const it = cat.items[i];
    await say(it[0]); if (my !== token) return;
    await wait(1500); if (my !== token) return;
    await say(it[2]); if (my !== token) return;
    await wait(1800); if (my !== token) return;
    i = (i + 1) % cat.items.length; show();
  }
}
function playWord(){
  stopAll();
  const a = ready();
  if (a){ audio.currentTime = a.items[i].t; stopAt = a.items[i].w; audio.playbackRate = P.rate; audio.play().catch(() => {}); }
  else say(cat.items[i][0]);
}
audio.ontimeupdate = () => {
  const a = ready(); if (!a) return;
  const t = audio.currentTime;
  if (stopAt !== null){ if (t >= stopAt){ audio.pause(); stopAt = null; } return; }
  if (!playing) return;
  let k = 0;
  while (k + 1 < a.items.length && a.items[k + 1].t <= t) k++;
  if (k !== i){ i = k; show(); }
  if (hidden) $('study').classList.toggle('hide', t < a.items[i].u); // o'zbekchasi o'qilganda ochiladi
};
// quloqchin/qulflangan ekrandan to'xtatilsa yoki davom ettirilsa
audio.onpause = () => { if (playing && stopAt === null && ready()){ playing = false; updAuto(); } };
audio.onplay = () => { if (!playing && stopAt === null){ playing = true; updAuto(); } };

// saytdan chiqilsa (boshqa ilova, yopilgan tab yoki o'chgan ekran) — to'xtaydi
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
addEventListener('pagehide', stopAll);

// tinglash paytida ekran o'zi o'chib, ijroni to'xtatib qo'ymasin
let wakeLock = null;
async function keepAwake(on){
  if (!('wakeLock' in navigator)) return;
  if (on && !wakeLock && !document.hidden){
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (!playing){ lock.release().catch(() => {}); return; } // kutish paytida to'xtatildi
      wakeLock = lock; lock.onrelease = () => { if (wakeLock === lock) wakeLock = null; };
    } catch (e) {}
  } else if (!on && wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}

function updAuto(){
  keepAwake(playing);
  $('auto').classList.toggle('on', playing);
  $('auto').textContent = playing ? '⏸ To\'xtatish' : '🎧 Tinglash';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}
function updMedia(){
  if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
  const it = cat.items[i];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: plain(it[0]), artist: it[1], album: cat.uz + ' — rus tili',
    artwork: [{src: 'icon-512.png', sizes: '512x512', type: 'image/png'}]
  });
}
if ('mediaSession' in navigator){
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  h('play', () => cat && startAuto()); h('pause', stopAll); h('stop', stopAll);
  h('nexttrack', () => cat && go(1)); h('previoustrack', () => cat && go(-1));
}

/* --- Ko'rinish --- */
function note(t){ $('note').textContent = t; }
function renderHome(){
  const cats = $('cats');
  cats.innerHTML = '';
  CATS.forEach((c, n) => {
    const pct = Math.round(Math.min(P.seen[c.id] || 0, c.items.length) / c.items.length * 100);
    const b = document.createElement('button');
    b.className = 'cat';
    b.innerHTML = `<div class="ic">${c.icon}</div>
      <div class="nm">${c.uz}<i>${c.ru}</i></div>
      <div class="bar"><div style="width:${pct}%"></div></div>`;
    b.onclick = () => openCat(n, 0);
    cats.appendChild(b);
  });
  const ln = P.last ? CATS.findIndex(c => c.id === P.last.id) : -1;
  $('cont').classList.toggle('hidden', ln < 0);
  if (ln >= 0){
    const c = CATS[ln], k = Math.min(P.last.i, c.items.length - 1);
    $('contT').textContent = `${c.uz} · ${k + 1}/${c.items.length}`;
    $('cont').onclick = () => openCat(ln, k);
  }
}
function openCat(n, start){
  cat = CATS[n]; catN = n; i = start || 0;
  $('home').classList.add('hidden'); $('study').classList.remove('hidden');
  note(!track() && !ruVoice ? "Bu mavzu audiosi hali tayyor emas, qurilmada rus ovozi ham topilmadi." : '');
  show();
  loadAudio(); // oldindan yuklab qo'yamiz: «Tinglash» bosilganda darhol boshlansin
}
function show(){
  const [ru, uz, sr, su] = cat.items[i];
  $('ru').textContent = stress(ru); $('uz').textContent = uz;
  $('sr').textContent = stress(sr); $('su').textContent = '(' + su + ')';
  $('count').textContent = `${i + 1} / ${cat.items.length}`;
  $('study').classList.toggle('hide', hidden);
  P.last = {id: cat.id, i};
  P.seen[cat.id] = Math.max(P.seen[cat.id] || 0, i + 1);
  saveP(); updMedia();
}
function go(d){
  i = (i + d + cat.items.length) % cat.items.length;
  show();
  if (playing) startAuto(); else stopAll();
}
function updSpeed(){ $('speed').textContent = P.rate + '×'; audio.playbackRate = P.rate; }

/* --- Tugmalar --- */
$('back').onclick = () => { stopAll(); $('study').classList.add('hidden'); renderHome(); $('home').classList.remove('hidden'); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('pw').onclick = playWord;
$('auto').onclick = () => playing ? stopAll() : startAuto();
$('speed').onclick = () => { P.rate = RATES[(RATES.indexOf(P.rate) + 1) % RATES.length]; saveP(); updSpeed(); };
$('hideBtn').onclick = () => {
  hidden = !hidden; $('hideBtn').classList.toggle('on', hidden);
  $('hideBtn').textContent = hidden ? "👁 Tarjimani ko'rsatish" : '👁 Tarjimani yashirish';
  $('study').classList.toggle('hide', hidden);
};
$('card').onclick = () => { if (hidden) $('study').classList.toggle('hide'); };
if (!RATES.includes(P.rate)) P.rate = 1;
updSpeed();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
