name: Audio

# words.json o'zgarsa, o'zgargan mavzular audiosini qayta yaratib commit qiladi
on:
  push:
    branches: [main]
    paths: [words.json, tools/**]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # TTS o'qimay qolgan kliplar bo'lsa, qayta urinadi

permissions:
  contents: write

# yangi push eskisini to'xtatadi; olingan kliplar baribir keshda saqlanadi
concurrency:
  group: audio
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: tools/.cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - run: pip install -r tools/requirements.txt
      - run: python tools/make_audio.py
      # xato yoki bekor qilinganda ham: shu paytgacha olingan kliplar yo'qolmasin
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/.cache
          key: tts-${{ github.run_id }}
      - name: Commit
        run: |
          git add audio
          if git diff --cached --quiet; then echo "Audio o'zgarmadi"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "audio: words.json bo'yicha yangilandi"
          # run davomida main oldinga ketgan bo'lishi mumkin
          for n in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
      # hisobot: tushib qolgan yoki chala o'qilgan ovoz bormi
      - run: python tools/check_audio.py
        continue-on-error: true
